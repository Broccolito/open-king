name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --release

      # The genotype files are never committed (.gitignore), so a fresh checkout has the
      # golden text but no corpus. Regenerate it from the seed. The scorecard below
      # asserts it measured all 10 datasets, so a missing corpus fails loudly rather
      # than passing while measuring nothing.
      #
      # This MUST run before `cargo test`, not after. `king-core`'s
      # `plink_entrypoint_matches_a_reference_row_without_text_roundtrip`
      # opens `tests/parity/golden/multifam.bed` directly, so with the old ordering it
      # panicked on every fresh checkout while passing on any developer machine that had
      # generated the corpus once. That is what turned all three `test` matrix legs red.
      - name: generate corpus
        run: python3 tests/parity/generate_corpus.py --outdir tests/parity/golden

      - run: cargo test --workspace

      # The row-level segment scorecard. docs/PARITY.md §4.4 quotes its "row=" and "est="
      # totals, so a change here is visible in the log of the run that made it.
      - name: segment scorecard
        run: cargo test -p king-core --test ibdseg_parity -- --nocapture
        env:
          KING_GOLDEN: tests/parity/golden

  # The documentation site is hand-written HTML with no build step, so nothing else
  # would notice a dangling link, a class with no rule behind it, or a page still
  # holding its scaffold placeholder. This job is that net. It also enforces the
  # site's two prose rules (no em dashes, no machine-register vocabulary), which
  # are exactly the kind of thing that erodes one commit at a time unless checked.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_site.py

  # The differential harness: replay all 480 captured reference invocations and require
  # the outcome to equal tests/parity/BASELINE.txt exactly — per case AND per output
  # file. It fails on a new difference and equally on an unrecorded improvement, so the
  # committed baseline can never drift away from what the tree actually does. The input
  # corpus is generated on the fly (Python 3 stdlib only); no reference binary is needed.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --release
      - run: python3 tests/parity/run_parity.py --impl ./target/release/king -q --baseline
