name: Release

# Tagging `v*` builds the `king` binary for every supported platform and attaches the
# archives to a GitHub release. The parity suite runs first on the tagged commit, so a
# release can only be cut from a tree whose measured behaviour matches the committed
# baseline.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate: the tagged commit must reproduce the recorded parity outcome exactly.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test --workspace
      - run: cargo build --release
      - run: python3 tests/parity/run_parity.py --impl ./target/release/king -q --baseline

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: king-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: king-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: king-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: king-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} -p king-cli

      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/king dist/
          cp LICENSE README.md dist/
          tar -czf ${{ matrix.name }}.tar.gz -C dist .

      - name: package (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\king.exe dist\
          copy LICENSE dist\
          copy README.md dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: docs/RELEASE_NOTES.md
          draft: false
          prerelease: false
