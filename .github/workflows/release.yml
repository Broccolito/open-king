name: Release

# Tagging `v*` builds the `king` binary for every supported platform and attaches the
# archives to a GitHub release. The parity suite runs first on the tagged commit, so a
# release can only be cut from a tree whose measured behaviour matches the committed
# baseline.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate: the tagged commit must reproduce the recorded parity outcome exactly.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The genotype corpus is never committed, and `open-king-core`'s PLINK
      # entrypoint test opens `tests/parity/golden/multifam.bed` directly, so this
      # has to run BEFORE `cargo test`. `ci.yml` has the same ordering and the same
      # comment; this job was missed when that one was fixed, and it turned every
      # tagged release red at the first gate.
      - name: generate corpus
        run: python3 tests/parity/generate_corpus.py --outdir tests/parity/golden

      - run: cargo test --workspace
      - run: cargo build --release
      - run: python3 tests/parity/run_parity.py --impl ./target/release/open-king -q --baseline

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: open-king-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: open-king-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: open-king-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: open-king-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} -p open-king-cli

      # The archive holds the executable and nothing else. A user unzips it and runs
      # it; there is no directory to descend into and no files to tidy up. LICENSE and
      # README travel with the repository and the release page, not inside every archive.
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/open-king dist/open-king
          chmod +x dist/open-king
          (cd dist && zip -q -X ../${{ matrix.name }}.zip open-king)

      - name: package (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\open-king.exe dist\open-king.exe
          Compress-Archive -Path dist\open-king.exe -DestinationPath ${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: docs/RELEASE_NOTES.md
          draft: false
          prerelease: false
